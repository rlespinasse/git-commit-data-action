name: git-commit-data-action
on:
  pull_request:
  push:
    branches:
      - v1.x
permissions: read-all
jobs:
  script-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e # v7.0.0
        with:
          # Need to download all history in order
          # to make the tests work properly
          fetch-depth: 0
      - uses: docker://ffurrer/bats:latest
        with:
          args: "--recursive ."

  os-testing:
    runs-on: ${{ matrix.os  }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e # v7.0.0
      - uses: ./
      - name: Output
        run: |
          echo "Get commit info"
          echo " - ${{ env.GIT_COMMIT_SHA }}"
          echo " - ${{ env.GIT_COMMIT_SHORT_SHA }}"
          echo "Get author info"
          echo " - ${{ env.GIT_COMMIT_AUTHOR }}"
          echo " - ${{ env.GIT_COMMIT_AUTHOR_NAME }}"
          echo " - ${{ env.GIT_COMMIT_AUTHOR_EMAIL }}"
          echo "Get committer info"
          echo " - ${{ env.GIT_COMMIT_COMMITTER }}"
          echo " - ${{ env.GIT_COMMIT_COMMITTER_NAME }}"
          echo " - ${{ env.GIT_COMMIT_COMMITTER_EMAIL }}"
          echo "Get message info"
          echo " - ${{ env.GIT_COMMIT_MESSAGE_SUBJECT }}"
          echo " - ${{ env.GIT_COMMIT_MESSAGE_SUBJECT_SANITIZED }}"
          echo " - ${{ env.GIT_COMMIT_MESSAGE_BODY }}"

  release:
    runs-on: ubuntu-latest
    needs:
      - script-testing
      - os-testing
    permissions:
      contents: write
      issues: write
      id-token: write
      packages: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e # v7.0.0
        with:
          persist-credentials: false

      - name: Release That
        uses: rlespinasse/release-that@23b4b6ed958ed78b7ffc36d2ee940bd8f5fd40c3 # v1.16.0
        with:
          github-token: ${{ secrets.GH_TOKEN }}
